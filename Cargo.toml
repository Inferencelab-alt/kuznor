[package]
name = "kuznor"
version = "0.1.0"
edition = "2024"
description = "Open-source local intelligence, forged in Rust"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
eframe = "0.31"
egui = "0.31"
hex = "0.4"
lopdf = "0.35"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rfd = "0.15"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
